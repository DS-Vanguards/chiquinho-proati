{% extends "base.html" %}
{% block title %}Verificar e-mail — Proati{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-kicker">PROATI</div>
    <h1>Confirme o e-mail</h1>
    <p class="subtitle">Enviamos um código para <strong>{{ email }}</strong>. Se essa caixa não existir no Gmail, Hotmail ou Outlook, o código não chega.</p>
    <form method="POST" class="form">
      <label for="code">Código de 6 dígitos</label>
      <input class="form-input" type="text" id="code" name="code" required minlength="6" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autofocus placeholder="000000">
      <button type="submit" class="save-btn auth-submit">CONFIRMAR E-MAIL</button>
    </form>
    <form method="POST" action="{{ url_for('resend_verification') }}" class="form" style="margin-top:12px">
      <button type="submit" class="close-footer-btn" style="width:100%">REENVIAR CÓDIGO</button>
    </form>
    <p class="auth-link">E-mail errado? <a href="{{ url_for('register') }}">Voltar ao cadastro</a></p>
  </div>
</div>
{% endblock %}
